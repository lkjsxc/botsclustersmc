name: BotsClustersMC
version: '0.7.0'
main: org.botsclustersmc.training.TrainingPlugin
api-version: '1.21'
folia-supported: true
load: POSTWORLD
commands:
  bots:
    description: Observe training or administer learned NPC policies
permissions:
  botsclustersmc.observe:
    description: Read training progress and use spectator cameras
    default: true
  botsclustersmc.admin:
    description: Pause, resume or change the runtime
    default: op
