name: Import and verify workstation source
on:
  push:
    branches: [station-learning]
    paths: ['.github/workflows/station-import.yml']
permissions:
  contents: write
concurrency:
  group: station-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: station-learning
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct exactly the locally verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/station-import/{0,1,2,3}.b64 | base64 --decode | gzip -d > /tmp/station.patch
          git apply --index /tmp/station.patch
          git rm .github/station-import/{0,1,2,3}.b64 .github/workflows/station-import.yml
          tree=$(git write-tree)
          test "$tree" = 7e523c9ba386bd7ea13d4ceaff6194424394835d
          echo "Verified source tree: $tree"
      - name: Pure Java and real API regression tests
        shell: bash
        run: |
          set -o pipefail
          ./test.sh 2>&1 | tee source-tests.log
      - name: Disposable live training and inference acceptance
        env:
          EULA: 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tests/acceptance.py all --count 64 --seconds 20 --output acceptance 2>&1 | tee live-tests.log
      - name: Publish normal work-branch commit without transport files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 7e523c9ba386bd7ea13d4ceaff6194424394835d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: verified workstation practice, correct recipe grids and immutable menu diagnostics' -m 'Source tree matches locally tested ec326aa24fbc9b9357cb60107f894ed6c9cb95ab. Frozen probes and exams keep full item requirements. Import files are removed. Ordinary PR validation and merge are still required.'
          git push origin HEAD:station-learning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstation-import-evidence
          path: |
            source-tests.log
            live-tests.log
            acceptance/*.json
            acceptance/*.log
          retention-days: 14
