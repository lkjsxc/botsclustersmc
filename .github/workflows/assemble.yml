name: Assemble reviewed Java source
on:
  push:
    branches: [work/runtime-separation-20260923]
    paths: [.github/workflows/assemble.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/runtime-separation-20260923
      - name: Materialize verified source transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd()
          text = ''.join((root / '.transfer' / f'part-{i}').read_text(encoding='utf-8') for i in range(1, 6))
          data = base64.b64decode(text, validate=True)
          assert hashlib.sha256(data).hexdigest() == '094e3c7e6a606b2e7bc51ca75900553e906c7ff30ba4c9e53066fbb504457b6c'
          payload = json.loads(lzma.decompress(data))
          def path(name):
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ('.git', '.github', '.transfer')
              return root.joinpath(*p.parts)
          for name in payload['delete']:
              p = path(name)
              if p.exists():
                  assert p.is_file() and not p.is_symlink()
                  p.unlink()
          for name, item in payload['files'].items():
              p = path(name)
              assert not p.is_symlink()
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(item['content'], encoding='utf-8', newline='')
              p.chmod(0o755 if item['executable'] else 0o644)
          shutil.rmtree(root / '.transfer')
          print(f"Assembled {len(payload['files'])} files and removed {len(payload['delete'])} retired paths.")
          PY
          git add -A -- . ':!.github'
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separate Java NPC training and portable inference'
          git push origin HEAD:work/runtime-separation-20260923
