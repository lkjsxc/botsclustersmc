name: Java runtime validation
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      eula_consent:
        description: Accept Minecraft EULA for disposable live test servers
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: java-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pure Java checks and real API compilation (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          ./test.sh 2>&1 | tee source-tests.log
      - name: Pure Java checks and real API compilation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./test.cmd 2>&1 | Tee-Object source-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-${{ runner.os }}
          path: source-tests.log
          retention-days: 14
  observatory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test client
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Offline synthetic observatory regression
        run: python tests/crafting_monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observatory-evidence
          path: .build/evidence/crafting-monitor
          retention-days: 14
  live:
    needs: source
    # Only an affirmative dispatch starts disposable Minecraft servers.
    if: github.event_name == 'workflow_dispatch' && inputs.eula_consent
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EULA: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fresh public build and real acceptance
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > tested-commit.txt
          ./build.sh 2>&1 | tee live-build.log
          python3 tests/acceptance.py all --count 1024 --seconds 45 --output acceptance 2>&1 | tee live-tests.log
          python3 tests/report.py acceptance > capacity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evidence
          path: |
            tested-commit.txt
            live-build.log
            live-tests.log
            capacity.json
            acceptance/*.log
            acceptance/*.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: java-delivery
          path: |
            dist/botsclustersmc.jar
            dist/training.jar
            acceptance/deploy
          retention-days: 14
  paper:
    needs: live
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.1
            java: '21'
          - minecraft: 1.21.11
            java: '21'
          - minecraft: '26.2'
            java: '25'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EULA: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: java-delivery
      - name: Actual named Paper version, not API stubs
        shell: bash
        run: |
          set -o pipefail
          python3 tests/download_server.py '${{ matrix.minecraft }}' paper-cache 2>&1 | tee paper-download.log
          python3 tests/acceptance.py inference --cache paper-cache --deploy acceptance/deploy --output paper-inference 2>&1 | tee paper-inference.log
          python3 tests/acceptance.py fixtures --cache paper-cache --output paper-fixtures 2>&1 | tee paper-fixtures.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-${{ matrix.minecraft }}
          path: |
            paper-cache/download.json
            paper-download.log
            paper-inference.log
            paper-fixtures.log
            paper-inference/*.log
            paper-inference/*.json
            paper-fixtures/*.log
          retention-days: 14
  windows-live:
    needs: live
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      EULA: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual Windows source launcher, learner, export and inference
        shell: pwsh
        run: |
          ./build.cmd 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/acceptance.py all --count 32 --seconds 15 --output windows-acceptance 2>&1 | Tee-Object windows-live.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-live
          path: |
            windows-build.log
            windows-live.log
            windows-acceptance/*.log
            windows-acceptance/*.json
          retention-days: 14
