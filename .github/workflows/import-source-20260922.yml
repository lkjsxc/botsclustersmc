name: Verify and import source runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-source-20260922.yml'
permissions:
  contents: write
concurrency:
  group: source-runtime-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/runtime-source.tar.xz"
          : > "$archive"
          for sha in \
            510d9e8da85ebae3d698d00d7be2a3da8f077ede \
            9d1591622e793c6fdb83fc21949f67a43dc46d80 \
            e44fbf5c3f9c250ec26e886066fba6f9f81a4744 \
            f521b4e3d3cef2f9e56989388f66e87d70585f2f \
            4a1c6a3caa05d9fefbeef890838b56d5efd1f771 \
            79a665d65791c60da68e24d9a80fb49117c99958 \
            001c9961ff34e65e1eccb339feba6840a285be0b \
            e21832196e39b689809c008b6beda2d944ba4858 \
            cb6b60c36a2a250268451b517375798e666b4de8 \
            a0948a31a2fb39d331b9950accdc56893fbe9774 \
            05bcb06e1da5475a3a9f0357b9fa2197f256d6c6 \
            4879818165e2f42665074e39290a2f9507bb1ffd \
            5e892dedd1a56aa333e119c74b49fe4df4d1eb0b \
            3f255798d1414f8adf43040e579ed97cac3b4ed0; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$archive"
          done
          echo "2b9dfb72bb14a106e6613e3ec0ba6b8cdc7120c8a8fca2c37818dc9b99d95e5e  $archive" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, tarfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          roots = {'app','bridge','deploy','docs','launcher','learning','licenses','pins','scripts','tests'}
          files = {'.env.example','.gitignore','AGENTS.md','CHANGELOG.md','DELIVERY.md','LICENSE','NOTICE','README.ja.md','README.md','VERSION','academy.sh','console.sh','smoke.sh','start.sh','status.sh','stop.sh'}
          with tarfile.open(temp / 'runtime-source.tar.xz') as archive:
              members = archive.getmembers()
              assert len(members) == 85
              assert sum(m.size for m in members) == 346209
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts
                  assert (len(p.parts) == 1 and m.name in files) or (len(p.parts) > 1 and p.parts[0] in roots)
                  assert m.mode in (0o644, 0o755)
              assert len({m.name for m in members}) == len(members)
              archive.extractall('.', filter='data')
              (temp / 'source-paths.txt').write_text(''.join(m.name + '\n' for m in members))
          PY
      - name: Test source bootstrap and preservation guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          ./scripts/preflight.sh
          ./scripts/build-host-tools.sh 2>&1 | tee "$RUNNER_TEMP/evidence/host-tools.log"
          python3 tests/package_checks.py 2>&1 | tee "$RUNNER_TEMP/evidence/package.log"
          python3 tests/bootstrap_checks.py 2>&1 | tee "$RUNNER_TEMP/evidence/bootstrap.log"
          python3 tests/recovery_checks.py 2>&1 | tee "$RUNNER_TEMP/evidence/recovery.log"
          ./scripts/test-bridge.sh 2>&1 | tee "$RUNNER_TEMP/evidence/bridge-unit.log"
      - name: Build pinned native runtime from an empty dependency cache
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh 2>&1 | tee "$RUNNER_TEMP/evidence/native-build.log"
      - name: Fetch pinned Folia and compile the real environment bridge
        shell: bash
        run: |
          set -euo pipefail
          printf 'botsclustersmc-academy-v1\nbots=32\ncampus=8x16\n' > .botsclustersmc-academy-v1
          BCMC_ROOT="$PWD" bin/botsclustersmc-run check-bridge 2>&1 | tee "$RUNNER_TEMP/evidence/folia-api.log"
          rm .botsclustersmc-academy-v1
          cp bin/build-manifest.txt "$RUNNER_TEMP/evidence/"
          printf '%s\n' 'Fresh source build, dependency download and Folia API compilation only. No live Minecraft server or EULA acceptance in this job.' > "$RUNNER_TEMP/evidence/scope.txt"
      - name: Publish reviewed plaintext sources without force push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main changed during verification; refuse overwrite'; exit 1; }
          git add --pathspec-from-file="$RUNNER_TEMP/source-paths.txt"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: runnable source-first Folia academy with 32 reward-trained bots'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/published-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-runtime-bootstrap-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: warn
