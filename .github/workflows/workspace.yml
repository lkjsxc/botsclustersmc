name: Runtime engineering workspace
on:
  push:
    branches: [work/runtime-separation-20260923]
    paths: [.github/workflows/workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bcmc-workspace
          git archive HEAD | gzip > /tmp/bcmc-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/bcmc-workspace/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-source
          path: /tmp/bcmc-workspace
          retention-days: 3
          if-no-files-found: error
