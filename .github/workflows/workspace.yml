name: Runtime engineering workspace
on:
  push:
    branches: [work/runtime-separation-20260923]
    paths: [.github/workflows/workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source and official server libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bcmc-workspace/server
          git archive HEAD | gzip > /tmp/bcmc-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/bcmc-workspace/commit.txt
          mapfile -t pin < pins/folia.lock
          curl --fail --location --retry 3 "${pin[2]}" -o /tmp/bcmc-workspace/server/server.jar
          echo "${pin[3]}  /tmp/bcmc-workspace/server/server.jar" | sha256sum -c -
          cd /tmp/bcmc-workspace/server
          java -Xmx1G -Dpaperclip.patchonly=true -jar server.jar
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-workspace
          path: /tmp/bcmc-workspace
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
