name: Runtime engineering workspace
on:
  push:
    branches: [work/runtime-separation-20260923]
    paths: [.github/workflows/workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Rust compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-02-04 --profile minimal
          mkdir -p /tmp/bcmc-workspace
          compiler=$(rustup which --toolchain nightly-2026-02-04 rustc)
          toolchain=$(dirname "$(dirname "$compiler")")
          tar -C "$toolchain" -czf /tmp/bcmc-workspace/rust-toolchain.tar.gz bin lib libexec
          rustup run nightly-2026-02-04 rustc --version --verbose > /tmp/bcmc-workspace/compiler.txt
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-compiler
          path: /tmp/bcmc-workspace
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
