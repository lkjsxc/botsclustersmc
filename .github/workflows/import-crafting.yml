name: Import tested crafting candidate
on:
  push:
    branches: [work/20260924-crafting]
    paths: ['.crafting.patch.gz', '.github/workflows/import-crafting.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'lkjsxc/botsclustersmc' && github.ref == 'refs/heads/work/20260924-crafting'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish source files only; workflow edits belong to the authorized connector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3a3ddf0fc1b64614dc10e9d29adad99279aebfff
          gzip -dc .crafting.patch.gz > "$RUNNER_TEMP/crafting.patch"
          git apply --check --exclude='.github/workflows/*' "$RUNNER_TEMP/crafting.patch"
          git apply --exclude='.github/workflows/*' "$RUNNER_TEMP/crafting.patch"
          rm -- .crafting.patch.gz
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          # Verify the final planned source tree without changing this checkout's workflows.
          cp .git/index "$RUNNER_TEMP/final-tree.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/final-tree.index" git update-index --force-remove .github/workflows/import-crafting.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/final-tree.index" git write-tree)" = 7e308cac755b1057f27fe2af98c7b28acd178c1b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(training): restore reachable crafting practice and separate outcomes'
          git push origin HEAD:refs/heads/work/20260924-crafting
