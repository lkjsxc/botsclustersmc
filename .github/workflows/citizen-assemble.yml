name: Verified citizen source delivery
on:
  push:
    branches: [work/citizen-observation-20260923]
permissions:
  contents: read
concurrency:
  group: citizen-source-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/work/citizen-observation-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assemble and verify the exact reviewed source
        run: python3 .github/citizen-source/assemble.py
      - name: Numerical, persistence, concurrency and aiming tests
        shell: bash
        run: |
          set -euo pipefail
          ./test.sh 2>&1 | tee "$RUNNER_TEMP/citizen-source-tests.log"
      - name: Authorized disposable real-server acceptance
        env:
          EULA: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/acceptance.py all --count 64 --seconds 20 --output .build/delivery-live 2>&1 | tee "$RUNNER_TEMP/citizen-live-tests.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual non-operator observer and browser
        env:
          EULA: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .build/browser --no-audit --no-fund playwright@1.63.0
          npm install --prefix .build/observer-client --no-audit --no-fund mineflayer@4.39.0
          .build/browser/node_modules/.bin/playwright install --with-deps chromium
          python3 tests/observe.py --output .build/delivery-observer 2>&1 | tee "$RUNNER_TEMP/citizen-observer-tests.log"
      - name: Commit verified source to the engineering branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/citizen-observation-20260923
          test "$(git write-tree)" = c942bcd29de2d72af1710dc935567be20ee37f9d
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: deliver verified citizen observation and progressive motor learning'
          git push origin HEAD:refs/heads/work/citizen-observation-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citizen-delivery-evidence
          path: |
            ${{ runner.temp }}/citizen-*-tests.log
            .build/delivery-live/*.json
            .build/delivery-observer/*.log
            .build/delivery-observer/*.json
            .build/monitor-desktop.png
            .build/monitor-mobile.png
          retention-days: 14
