name: Source runtime verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-runtime.yml','app/**','launcher/**','learning/**','bridge/**','pins/**','scripts/**','tests/**','*.sh','.env.example','VERSION']
  pull_request:
    paths: ['.github/workflows/source-runtime.yml','app/**','launcher/**','learning/**','bridge/**','pins/**','scripts/**','tests/**','*.sh','.env.example','VERSION']
permissions:
  contents: read
concurrency:
  group: source-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify fresh checkout and host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-commit.txt"
          for path in bin runtime .build academy academy-v2 server state .env; do test ! -e "$path"; done
          ./scripts/preflight.sh
          ./scripts/build-host-tools.sh > "$RUNNER_TEMP/evidence/host-build.log" 2>&1
          for suite in package_checks bootstrap_checks recovery_checks; do
            python3 "tests/$suite.py" 2>&1 | tee "$RUNNER_TEMP/evidence/$suite.log"
          done
          ./scripts/test-bridge.sh 2>&1 | tee "$RUNNER_TEMP/evidence/bridge-unit.log"
      - name: Build and test the actual pinned native application without a project cache
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh > "$RUNNER_TEMP/evidence/native-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/evidence/native-build.log"; exit 1; }
          cp bin/build-manifest.txt "$RUNNER_TEMP/evidence/"
          grep -E 'test result:|Build and local' "$RUNNER_TEMP/evidence/native-build.log"
      - name: Compile the actual 64-actor Folia bridge
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .botsclustersmc-academy-v2' EXIT
          printf 'botsclustersmc-academy-v2\nbots=64\ncampus=8x16\n' > .botsclustersmc-academy-v2
          BCMC_ROOT="$PWD" BOTS=64 bin/botsclustersmc-run check-bridge 2>&1 | tee "$RUNNER_TEMP/evidence/folia-api.log"
          printf '%s\n' 'Fresh source tests, native builds and actual Folia API compilation. No live Minecraft server, operator EULA acceptance or skill-performance claim.' > "$RUNNER_TEMP/evidence/scope.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-runtime-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
