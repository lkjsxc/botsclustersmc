name: Runtime review workspace
on:
  push:
    branches: [work/runtime-hardening-20260923]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bcmc-review
          git archive HEAD | gzip > /tmp/bcmc-review/source.tar.gz
          git rev-parse HEAD > /tmp/bcmc-review/commit.txt
          git ls-tree -r HEAD > /tmp/bcmc-review/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-review-source
          path: /tmp/bcmc-review
          retention-days: 3
          if-no-files-found: error
