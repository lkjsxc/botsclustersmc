name: Pinned native dependency kit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-toolchain.yml'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare pinned build dependencies (no operator data)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit
          export RUSTUP_HOME="$PWD/kit/rustup"
          export CARGO_HOME="$PWD/kit/cargo"
          rustup toolchain install nightly-2026-02-04 --profile minimal
          git init kit/azalea
          git -C kit/azalea remote add origin https://github.com/azalea-rs/azalea.git
          git -C kit/azalea fetch --depth=1 origin f8ddefa70cc53e6385785fb56e7a688a389cf0ab
          git -C kit/azalea checkout --detach FETCH_HEAD
          (cd kit/azalea && rustup run nightly-2026-02-04 cargo fetch --locked --target x86_64-unknown-linux-gnu)
          cp "$(command -v rustup)" kit/rustup-bin
          rustup run nightly-2026-02-04 rustc --version --verbose > kit/toolchain.txt
          git -C kit/azalea rev-parse HEAD > kit/azalea-revision.txt
          tar -czf native-dependency-kit.tar.gz kit
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-native-dependencies
          path: native-dependency-kit.tar.gz
          retention-days: 1
          compression-level: 0
