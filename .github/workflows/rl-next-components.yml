name: Canonical RL numerical verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rl-next-components.yml','experimental/rl-next/**','learning/src/next/**']
  pull_request:
    paths: ['.github/workflows/rl-next-components.yml','experimental/rl-next/**','learning/src/next/**']
permissions:
  contents: read
concurrency:
  group: rl-numerics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test canonical modules in debug and optimized builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p component-evidence
          git rev-parse HEAD > component-evidence/source-commit.txt
          rustup toolchain install nightly-2026-02-04 --profile minimal
          for profile in debug release; do
            flags=(); if [ "$profile" = release ]; then flags+=(--release); fi
            rustup run nightly-2026-02-04 cargo test --manifest-path experimental/rl-next/Cargo.toml --locked --all-targets "${flags[@]}" -- --test-threads=1 2>&1 | tee "component-evidence/$profile.log"
          done
          rustup run nightly-2026-02-04 cargo build --manifest-path experimental/rl-next/Cargo.toml --locked --release
          experimental/rl-next/target/release/bcmc-rl-check benchmark > component-evidence/synthetic-bandit.json
          experimental/rl-next/target/release/bcmc-rl-check stages > component-evidence/task-contracts.txt
          printf '%s\n' 'This job verifies shared numerical components and a synthetic benchmark, not live Minecraft skill or learning speed. The production runtime imports this same canonical implementation.' > component-evidence/scope.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rl-numerical-evidence
          path: component-evidence
          retention-days: 30
          if-no-files-found: error
