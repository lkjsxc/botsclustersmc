name: Apply verified runtime patch
on:
  push:
    branches: [work/runtime-hardening-20260923]
    paths: [.github/workflows/apply-runtime.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/runtime-hardening-20260923
          fetch-depth: 2
      - name: Apply only the exact reviewed source patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 520be1e87beb4b019048c14c4791e9183df77309
          gh api repos/lkjsxc/botsclustersmc/git/blobs/19d2ebc78fc31e59ad244a3031ffc27009387d4d --jq .content | base64 -d | gzip -d > /tmp/runtime.patch
          git apply --index --unidiff-zero /tmp/runtime.patch
          git rm .github/workflows/apply-runtime.yml
          test "$(git write-tree)" = 2f94c5bed746bac19821ce8c37169e1baf05ed86
          git diff --cached --check
          git config user.name 'Runtime integration'
          git config user.email 'integration@botsclustersmc.invalid'
          git commit -m 'fix: canonical model export and isolated asynchronous inference replies'
          git push origin HEAD:refs/heads/work/runtime-hardening-20260923
          gh workflow run validate.yml --repo lkjsxc/botsclustersmc --ref work/runtime-hardening-20260923 -f eula_consent=true
