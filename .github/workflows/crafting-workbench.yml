name: Crafting workbench
on:
  push:
    branches: [work/20260924-crafting]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git rev-parse HEAD > snapshot-commit.txt
          git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: crafting-source
          path: |
            source.tar
            snapshot-commit.txt
          retention-days: 3
