name: RL64 integration workbench
on:
  push:
    branches: ['integration/rl64-observer']
    paths: ['.github/workflows/integration-workbench.yml', '.github/rl64/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read integration boundaries
        run: |
          for f in learning/src/lib.rs experimental/rl-next/src/math/time.rs experimental/rl-next/src/math/distribution.rs experimental/rl-next/src/curriculum/checkpoint.rs app/settings.rs launcher/config.rs launcher/academy_audit.rs scripts/env.sh scripts/build-state.sh academy.sh; do
            echo "===== $f ====="
            cat "$f"
          done
          echo '===== POPULATION AND FRAME CONSTRAINTS ====='
          grep -RnE '32|640|1292|view.distance|VIEW_DISTANCE|simulation.distance|Curriculum::|academy::|NAMES|STAGES|BCMCLAB2|BCMCCAMPUS1' app launcher learning/src/lib.rs bridge scripts tests academy.sh smoke.sh | head -260
      - name: Read pinned input-device implementation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/azalea-rs/azalea.git "$RUNNER_TEMP/azalea"
          cd "$RUNNER_TEMP/azalea"
          git checkout f8ddefa70cc53e6385785fb56e7a688a389cf0ab
          grep -RnE 'pub fn start_use_item|pub fn use_item_on|pub fn get_inventory|pub fn left_click|pub fn right_click' azalea* --include='*.rs'
          grep -Rl 'pub fn start_use_item' azalea* --include='*.rs' | xargs -r cat
