name: Integration workbench
on:
  push:
    branches: ['work/rl64-integration-20260923']
    paths: ['.maintenance/promote.py', '.github/workflows/integration-workbench.yml']
permissions:
  contents: write
concurrency:
  group: integration-workbench
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Promote reviewed plaintext sources on the work branch
        run: |
          set -euo pipefail
          python3 .maintenance/promote.py
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning experimental scripts/build.sh
          git commit -m 'refactor: share canonical RL-next mechanisms with the native learning tree'
          git push origin HEAD:work/rl64-integration-20260923
      - name: Compile and test promoted shared modules
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-02-04 --profile minimal
          rustup run nightly-2026-02-04 rustc --edition=2024 --test -O learning/src/lib.rs -o /tmp/core-tests
          /tmp/core-tests
          rustup run nightly-2026-02-04 cargo test --manifest-path experimental/rl-next/Cargo.toml --locked --release
      - name: Inspect remaining population and protocol boundaries
        if: always()
        run: |
          grep -RnE '(32|BCMCLAB2|curriculum::Curriculum|academy/)' scripts launcher bridge/src app/settings.rs | head -n 160 || true
