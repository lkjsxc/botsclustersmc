name: Integration workbench
on:
  push:
    branches: ['work/rl64-integration-20260923']
    paths: ['.maintenance/**','.github/workflows/integration-workbench.yml']
permissions:
  contents: write
concurrency:
  group: integration-workbench
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply reviewed source transformations on the work branch
        id: patch
        run: |
          set -euo pipefail
          if [ ! -d learning/src/next ]; then python3 .maintenance/promote.py; fi
          for script in .maintenance/patch*.py; do python3 "$script"; done
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: apply reviewed integration source transformations'
            git push origin HEAD:work/rl64-integration-20260923
          fi
          mkdir -p /tmp/evidence
          git rev-parse HEAD > /tmp/evidence/source.txt
      - name: Compile and test canonical native learning modules
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-02-04 --profile minimal
          rustup run nightly-2026-02-04 rustc --edition=2024 --test learning/src/lib.rs -o /tmp/core-debug
          /tmp/core-debug 2>&1 | tee /tmp/evidence/core-debug.txt
          rustup run nightly-2026-02-04 rustc --edition=2024 --test -O learning/src/lib.rs -o /tmp/core-release
          /tmp/core-release 2>&1 | tee /tmp/evidence/core-release.txt
          rustup run nightly-2026-02-04 cargo test --manifest-path experimental/rl-next/Cargo.toml --locked --release 2>&1 | tee /tmp/evidence/standalone.txt
      - name: Pure Java task and observer contracts
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./scripts/test-bridge.sh 2>&1 | tee /tmp/evidence/java-contracts.txt
      - name: Host bootstrap and preservation regressions
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./scripts/preflight.sh
          ./scripts/build-host-tools.sh
          rc=0
          for suite in package_checks bootstrap_checks recovery_checks; do
            python3 "tests/$suite.py" > "/tmp/evidence/$suite.txt" 2>&1 || rc=1
            cat "/tmp/evidence/$suite.txt"
          done
          exit "$rc"
      - name: Compile and test the actual pinned native actor and launcher
        id: native
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./scripts/build.sh 2>&1 | tee /tmp/evidence/native-build.txt
      - name: Compile the complete plugin against the actual Folia API
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -euo pipefail
          trap 'rm -f .botsclustersmc-academy-v2' EXIT
          printf 'botsclustersmc-academy-v2\nbots=64\ncampus=8x16\n' > .botsclustersmc-academy-v2
          BCMC_ROOT="$PWD" BOTS=64 bin/botsclustersmc-run check-bridge 2>&1 | tee /tmp/evidence/folia-api.txt
          printf '%s\n' 'Source compilation, regression and real Folia API evidence only. No live Minecraft skill or 64-player capacity claim.' > /tmp/evidence/scope.txt
      - name: Inspect remaining integration boundaries
        if: always()
        run: |
          grep -RnE '(BCMCLAB2|bcmc_academy_v1|BOTS.*32|bots>32|bots > 32|academy\\.bcmc|policy\\.bcmc|curriculum::Curriculum)' app launcher scripts tests bridge .env.example | head -n 120 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-tests
          path: /tmp/evidence
          retention-days: 30
