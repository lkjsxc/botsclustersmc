name: RL64 integration workbench
on:
  push:
    branches: ['integration/rl64-observer']
    paths: ['.github/workflows/integration-workbench.yml', '.github/rl64/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rl64-workbench
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed integration migration
        run: python3 .github/rl64/prepare.py
      - name: Apply integration corrections
        run: |
          if test -f .github/rl64/fixes.py; then python3 .github/rl64/fixes.py; fi
      - name: Compile and test actual runtime learning core
        run: |
          rustup toolchain install nightly-2026-02-04 --profile minimal
          rustup run nightly-2026-02-04 rustc --edition=2024 --test -O learning/src/lib.rs -o "$RUNNER_TEMP/core-tests"
          "$RUNNER_TEMP/core-tests" --test-threads=1
      - name: Show failed source boundary
        if: failure()
        run: |
          echo '===== ORIGINAL NETWORK ====='
          git show 720d989b3999d07437185fc407609d1c90d9fbc9:learning/src/network.rs | head -105
          echo '===== ORIGINAL PPO ====='
          git show 720d989b3999d07437185fc407609d1c90d9fbc9:learning/src/ppo.rs | head -160
          echo '===== GEOMETRY SIGNATURES ====='
          grep -nE 'fn |struct |enum ' learning/src/curriculum.rs | head -30
