name: Integration workbench
on:
  push:
    branches: ['work/rl64-integration-20260923']
    paths: ['.maintenance/**','.github/workflows/integration-workbench.yml']
permissions:
  contents: write
concurrency:
  group: integration-workbench
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply bounded diagnostic correction
        run: |
          set -euo pipefail
          python3 .maintenance/patch_diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/live-client.rs
          if ! git diff --cached --quiet; then
            git commit -m 'test: distinguish spectator flight and actual gameplay input acknowledgements'
            git push origin HEAD:work/rl64-integration-20260923
          fi
          mkdir -p /tmp/evidence
          git rev-parse HEAD > /tmp/evidence/source.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            .build/cargo
            .build/rustup
            .build/azalea/target
          key: bcmc-native-linux-20260204-v3-${{ github.sha }}
          restore-keys: bcmc-native-linux-20260204-v3-
      - name: Build and verify native source
        run: |
          set -euo pipefail
          ./scripts/build-host-tools.sh >/tmp/evidence/host-build.txt 2>&1
          if ! ./scripts/build.sh >/tmp/evidence/native-build.txt 2>&1; then tail -n 100 /tmp/evidence/native-build.txt; exit 1; fi
          grep 'test result:' /tmp/evidence/native-build.txt
      - name: Independent 18-task and observer live diagnostics
        run: |
          set -euo pipefail
          EULA=true ./scripts/test-live-fixtures.sh >/tmp/evidence/fixtures.txt 2>&1 || result=$?
          for file in experiments/fixtures-*/logs/fixtures.log experiments/fixtures-*/logs/observer.log; do
            test ! -f "$file" || grep -E 'DIAGNOSTIC (PASS|STATE|FAILURE|TASK FAILURE|RESET)|OBSERVER|^PASS:|^Error:' "$file" | tail -n 100 || true
          done
          if [[ ${result:-0} != 0 ]]; then tail -n 40 /tmp/evidence/fixtures.txt; exit "$result"; fi
      - name: Retain bounded diagnostic evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('/tmp/evidence');out.mkdir(exist_ok=True)
          for i,lab in enumerate(sorted(Path('experiments').glob('fixtures-*'))):
              for p in sorted((lab/'logs').glob('*')):
                  if p.is_file() and p.stat().st_size<16*1024*1024:
                      shutil.copyfile(p,out/f'live-{i}-{p.name}')
          PY
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: |
            .build/cargo
            .build/rustup
            .build/azalea/target
          key: bcmc-native-linux-20260204-v3-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-tests
          path: /tmp/evidence
          retention-days: 30
