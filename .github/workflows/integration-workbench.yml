name: Final integration acceptance
on:
  push:
    branches: ['work/rl64-integration-20260923']
    paths: ['.maintenance/finalize.py','.github/workflows/integration-workbench.yml']
permissions:
  contents: write
concurrency:
  group: integration-workbench
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Finish reviewed plaintext source and remove development-only machinery
        run: |
          set -euo pipefail
          python3 .maintenance/finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: verify a simultaneous observer with 64 learners and finish source integration'
          git push origin HEAD:work/rl64-integration-20260923
          mkdir -p /tmp/evidence
          git rev-parse HEAD > /tmp/evidence/source.txt
          for path in .maintenance bin runtime .build academy academy-v2 server state .env; do test ! -e "$path"; done
      - name: Verify all contracts and build from an empty project dependency cache
        id: native
        run: |
          set -euo pipefail
          check() { local name=$1; shift; if "$@" >"/tmp/evidence/$name.txt" 2>&1; then grep -E 'test result:|Ran [0-9]+ tests|PASS:|passed|^OK$' "/tmp/evidence/$name.txt" | tail -n 12 || true; else tail -n 100 "/tmp/evidence/$name.txt"; return 1; fi; }
          check preflight ./scripts/preflight.sh
          check host-build ./scripts/build-host-tools.sh
          check package python3 tests/package_checks.py
          check bootstrap python3 tests/bootstrap_checks.py
          check recovery python3 tests/recovery_checks.py
          check java-contracts ./scripts/test-bridge.sh
          check native-build ./scripts/build.sh
          cp bin/build-manifest.txt /tmp/evidence/
          RUSTUP_HOME="$PWD/.build/rustup" CARGO_HOME="$PWD/.build/cargo" rustup run nightly-2026-02-04 rustc --edition=2024 --test learning/src/lib.rs -o /tmp/core-debug
          check core-debug /tmp/core-debug
      - name: All 18 full-difficulty task and observer live diagnostics
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -euo pipefail
          EULA=true ./scripts/test-live-fixtures.sh >/tmp/evidence/fixtures.txt 2>&1 || result=$?
          for file in experiments/fixtures-*/logs/fixtures.log experiments/fixtures-*/logs/observer.log; do
            test ! -f "$file" || grep -E 'DIAGNOSTIC (PASS|FAILURE|TASK FAILURE|RESET|ENTITY)|OBSERVER|^PASS:|^Error:' "$file" | tail -n 70 || true
          done
          if [[ ${result:-0} != 0 ]]; then tail -n 60 /tmp/evidence/fixtures.txt; exit "$result"; fi
      - name: Public 64-actor learning and resume with a simultaneous observer
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -euo pipefail
          if ! EULA=true BCMC_TEST_NEW_ACADEMY=true BCMC_EVIDENCE_DIR=/tmp/evidence python3 tests/public_entry_checks.py >/tmp/evidence/public-entry.txt 2>&1; then tail -n 100 /tmp/evidence/public-entry.txt; exit 1; fi
          cat /tmp/evidence/public-entry.txt
          grep -E 'OBSERVER|^PASS:' /tmp/evidence/public-observer.log
          git diff --exit-code
      - name: Retain bounded execution evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('/tmp/evidence');out.mkdir(exist_ok=True)
          for i,lab in enumerate(sorted(Path('experiments').glob('fixtures-*'))+[Path('academy-v2')]):
              for p in sorted((lab/'logs').glob('*')):
                  if p.is_file() and p.stat().st_size<16*1024*1024:shutil.copyfile(p,out/f'live-{i}-{p.name}')
              for name in ['status.json','academy-status.json']:
                  p=lab/'state'/name
                  if p.exists():shutil.copyfile(p,out/f'live-{i}-{name}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-integration-evidence
          path: /tmp/evidence
          retention-days: 30
